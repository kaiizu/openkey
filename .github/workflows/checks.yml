name: checks

on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Compile Python
        run: python -m compileall -q butler run.py tools
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check browser JavaScript
        run: node --check web/app.js
      - name: Check i18n JavaScript
        run: node --check web/i18n.js
      - name: Check concept gallery JavaScript
        run: node --check docs/design/conceptos/app.js
